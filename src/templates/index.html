<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treap 視覺化展示</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div id="header">
        Treap 視覺化展示 
        <span class="status-badge" id="status-display">等待中...</span>
    </div>

    <div id="treap-container"></div>

    <div id="controls">
        <div class="playback-group">
            <button id="play-pause-btn" class="btn-step" onclick="togglePlay()">Play</button>
            <button class="btn-step" onclick="stepBack()">上一步</button>
            <button class="btn-step" onclick="stepNext()">下一步</button>
            <input type="range" id="speed-slider" min="200" max="2000" value="1000" onchange="updateSpeed()">
        </div>

        <span class="divider">|</span>

        <div class="seed-group">
            Seed: <input type="number" id="seed-input" value="67">
            <button class="btn-seed" onclick="handleSetSeed()">Set Seed</button>
        </div>

        <span class="divider">|</span>

        <div class="input-group">
            位置 (Idx): <input type="number" id="input-pos" value="1">
            數值 (Val): <input type="number" id="input-val" value="15">
            <button class="btn-insert" onclick="handleAction('insert')">Insert</button>
            <button class="btn-remove" onclick="handleAction('remove')">Remove</button>
            <button class="btn-clear" onclick="handleClear()">Clear</button>
        </div>
    </div>

    <script src="d3-logic.js"></script>
    <script src="app.js"></script>
</body>
</html>
